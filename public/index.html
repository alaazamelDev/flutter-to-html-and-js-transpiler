<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutter-like to HTML Transpiler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f0f3ff;
            border-color: #764ba2;
        }

        .upload-area.drag-over {
            background: #e8edff;
            border-color: #764ba2;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
        }

        textarea, .output-frame {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .output-frame {
            background: white;
            overflow: auto;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            background: white;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .example-btn {
            background: #f0f3ff;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab-btn {
            background: #f0f3ff;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flutter-like to HTML Transpiler</h1>
        <p class="subtitle">Transform your Flutter-like code into HTML & JavaScript</p>

        <div class="card">
            <h2>Upload Your Code</h2>
            <div class="upload-area" id="uploadArea">
                <p>📁 Drag & drop your .drt or .txt file here, or click to browse</p>
                <input type="file" id="fileInput" accept=".drt,.txt">
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
                <button class="btn" id="transpileBtn" disabled>Transpile</button>
            </div>

            <div class="message" id="message"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Transpiling your code...</p>
            </div>
        </div>

        <div class="card">
            <h2>Try Examples</h2>
            <div class="examples" id="examples">
                <button class="example-btn" onclick="loadExample('football.txt')">Football Example</button>
                <button class="example-btn" onclick="loadExample('login_screen.txt')">Login Screen</button>
                <button class="example-btn" onclick="loadExample('form.txt')">Form Example</button>
                <button class="example-btn" onclick="loadExample('container.txt')">Container Example</button>
            </div>
        </div>

        <div class="card">
            <div class="editor-container">
                <div class="editor-panel">
                    <div class="panel-header">Input Code (Flutter-like Syntax)</div>
                    <textarea id="inputCode" placeholder="Paste your Flutter-like code here or load an example..."></textarea>
                </div>
                <div class="editor-panel">
                    <div class="tab-buttons">
                        <button class="tab-btn active" onclick="switchTab('preview')">Preview</button>
                        <button class="tab-btn" onclick="switchTab('html')">HTML Source</button>
                    </div>
                    <div id="previewTab" class="tab-content active">
                        <iframe id="outputPreview"></iframe>
                    </div>
                    <div id="htmlTab" class="tab-content">
                        <div class="output-frame" id="outputCode"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const transpileBtn = document.getElementById('transpileBtn');
        const inputCode = document.getElementById('inputCode');
        const outputCode = document.getElementById('outputCode');
        const outputPreview = document.getElementById('outputPreview');
        const message = document.getElementById('message');
        const loading = document.getElementById('loading');
        let currentFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                inputCode.value = e.target.result;
                transpileBtn.disabled = false;
                showMessage('File loaded successfully!', 'success');
            };
            reader.readAsText(file);
        }

        transpileBtn.addEventListener('click', async () => {
            if (!currentFile && !inputCode.value) {
                showMessage('Please select a file or enter code', 'error');
                return;
            }

            const formData = new FormData();
            
            if (currentFile) {
                formData.append('file', currentFile);
            } else {
                const blob = new Blob([inputCode.value], { type: 'text/plain' });
                formData.append('file', blob, 'input.txt');
            }

            loading.classList.add('show');
            message.classList.remove('show');
            transpileBtn.disabled = true;

            try {
                const response = await fetch('/transpile', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                loading.classList.remove('show');
                transpileBtn.disabled = false;

                if (result.success) {
                    outputCode.textContent = result.output;
                    const blob = new Blob([result.output], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    outputPreview.src = url;
                    showMessage(result.message, 'success');
                } else {
                    showMessage('Error: ' + result.error + '\n' + (result.details || ''), 'error');
                }
            } catch (error) {
                loading.classList.remove('show');
                transpileBtn.disabled = false;
                showMessage('Network error: ' + error.message, 'error');
            }
        });

        async function loadExample(filename) {
            try {
                const response = await fetch(`/example/${filename}`);
                const result = await response.json();
                
                if (result.content) {
                    inputCode.value = result.content;
                    const blob = new Blob([result.content], { type: 'text/plain' });
                    currentFile = new File([blob], filename, { type: 'text/plain' });
                    transpileBtn.disabled = false;
                    showMessage(`Example "${filename}" loaded successfully!`, 'success');
                } else {
                    showMessage('Error loading example', 'error');
                }
            } catch (error) {
                showMessage('Error loading example: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type} show`;
            setTimeout(() => {
                message.classList.remove('show');
            }, 5000);
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(t => t.classList.remove('active'));
            buttons.forEach(b => b.classList.remove('active'));
            
            if (tab === 'preview') {
                document.getElementById('previewTab').classList.add('active');
                buttons[0].classList.add('active');
            } else {
                document.getElementById('htmlTab').classList.add('active');
                buttons[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
